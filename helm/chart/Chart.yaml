apiVersion: v2
name: g2k
description: A Helm chart for GitHub to Kafka webhook processing with Redpanda, supporting multiple webhook forwarders
type: application
version: 0.7.0
appVersion: "0.5.0"
home: https://github.com/vmelikyan/g2k
sources:
  - https://github.com/vmelikyan/g2k
maintainers:
  - name: vmelikyan
    url: https://github.com/vmelikyan
keywords:
  - github
  - webhooks
  - kafka
  - redpanda
  - event-processing
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: REPO_EXCLUDE environment variable for g2krepeater to exclude specific repositories
    - kind: added
      description: Repository filtering precedence - REPO_FILTERS takes precedence over REPO_EXCLUDE
    - kind: added
      description: Enhanced logging with specific skip reasons for filtered repositories
dependencies:
  - name: redpanda
    version: "~5.10.1"
    repository: https://charts.redpanda.com
    condition: global.kafka.enabled
