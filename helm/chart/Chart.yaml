apiVersion: v2
name: g2k
description: A Helm chart for GitHub to Kafka webhook processing with Redpanda, supporting multiple webhook forwarders
type: application
version: 0.8.0
appVersion: "0.5.0"
home: https://github.com/vmelikyan/g2k
sources:
  - https://github.com/vmelikyan/g2k
maintainers:
  - name: vmelikyan
    url: https://github.com/vmelikyan
keywords:
  - github
  - webhooks
  - kafka
  - redpanda
  - event-processing
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Configurable deployment strategy for g2krelay and g2krepeater deployments
    - kind: added
      description: Optional PodDisruptionBudget support for g2krelay and each g2krepeater instance
    - kind: removed
      description: Legacy single g2krepeater values compatibility; use g2krepeaters map entries
dependencies:
  - name: redpanda
    version: "~5.10.1"
    repository: https://charts.redpanda.com
    condition: global.kafka.enabled
