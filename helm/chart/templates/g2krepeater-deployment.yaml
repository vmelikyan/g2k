{{- /* Handle backward compatibility - convert old single g2krepeater to new format */}}
{{- $g2krepeaters := .Values.g2krepeaters }}
{{- if and ((.Values.g2krepeater).enabled | default false) (not $g2krepeaters) }}
  {{- $g2krepeaters = dict "default" .Values.g2krepeater }}
{{- else if and ((.Values.g2krepeater).enabled | default false) (not (hasKey $g2krepeaters "default")) }}
  {{- $_ := set $g2krepeaters "default" .Values.g2krepeater }}
{{- end }}

{{- range $name, $config := $g2krepeaters }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g2krepeater-{{ $name }}
  labels:
    app: g2krepeater
    instance: {{ $name }}
spec:
  replicas: {{ $config.replicas }}
  {{- with $config.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: g2krepeater
      instance: {{ $name }}
  template:
    metadata:
      labels:
        app: g2krepeater
        instance: {{ $name }}
    spec:
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: g2krepeater
          image: {{ include "g2k.g2krepeater.image" (dict "imageConfig" $config.image "chartAppVersion" $.Chart.AppVersion) | quote }}
          {{- with $config.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Always inject KAFKA_BOOTSTRAP_SERVERS with auto-config, unless explicitly overridden
            - name: "KAFKA_BOOTSTRAP_SERVERS"
              value: {{ if and $config.envVars (hasKey $config.envVars "KAFKA_BOOTSTRAP_SERVERS") (ne (index $config.envVars "KAFKA_BOOTSTRAP_SERVERS") "") }}{{ index $config.envVars "KAFKA_BOOTSTRAP_SERVERS" | quote }}{{ else }}{{ include "g2k.kafkaBrokers" $ | quote }}{{ end }}
            # Process all other environment variables (except KAFKA_BOOTSTRAP_SERVERS to avoid duplicates)
            {{- range $key, $val := $config.envVars }}
            {{- if ne $key "KAFKA_BOOTSTRAP_SERVERS" }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
{{- end }}
{{- end }}
