redpanda:
  enabled: true
  replicas: 1
  image:
    repository: redpandadata/redpanda
    tag: "" # Defaults to latest if not specified
  containerPort: 9092
  overprovisioned: true
  smp: 1
  memory: "1G"
  reserveMemory: "0M"
  nodeId: "0"
  kafkaAdvertisedHost: "redpanda"
  resources:
    limits:
      memory: "2Gi"

redpandaConsole:
  enabled: true
  image:
    repository: redpandadata/console
    tag: "" # Defaults to latest if not specified
  replicas: 1
  kafkaBrokers: "redpanda.lifecycle-app.svc.cluster.local:9092"

g2krelay:
  enabled: true
  replicas: 1
  image:
    repository: vmelikyan/g2krelay
    tag: "" # Defaults to Chart.AppVersion if not specified
  serviceType: ClusterIP
  servicePort: 5050
  envVars:
    KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    WEBHOOK_SECRET: ""

  ingress:
    enabled: false
    host: ""
    path: "/"
    annotations: {}
    tls: []

g2krepeaters: {}
