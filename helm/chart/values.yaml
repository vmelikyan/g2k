# Global configuration
global:
  kafka:
    # Set to false to disable Redpanda subchart and use external Kafka
    enabled: true
    # External Kafka broker addresses (used when enabled=false)
    # Example: "kafka1.example.com:9092,kafka2.example.com:9092"
    externalBrokers: ""

# Configuration for the official Redpanda Helm chart
# These values are passed to the redpanda subchart when global.kafka.enabled=true
redpanda:
  storage:
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "" # Uses default storage class if not specified
  resources:
    cpu:
      cores: 1
    memory:
      enable_memory_locking: false
      container:
        max: 2Gi
  console:
    enabled: false # Disable console by default - can be enabled with proper configuration
  listeners:
    kafka:
      tls:
        enabled: false

g2krelay:
  enabled: true
  replicas: 1
  image:
    repository: vmelikyan/g2krelay
    tag: "" # Defaults to Chart.AppVersion if not specified
  serviceType: ClusterIP
  servicePort: 5050

  ingress:
    enabled: false

g2krepeaters: {}
