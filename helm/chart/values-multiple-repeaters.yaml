# Example configuration for deploying multiple g2krepeater instances
# This file demonstrates various use cases for webhook forwarding

redpanda:
  enabled: true
  replicas: 1
  image:
    repository: redpandadata/redpanda
    tag: ""  # Defaults to latest if not specified
  containerPort: 9092
  overprovisioned: true
  smp: 1
  memory: "1G"
  reserveMemory: "0M"
  nodeId: "0"
  kafkaAdvertisedHost: "redpanda"
  resources:
    limits:
      memory: "2Gi"

redpandaConsole:
  enabled: true
  image:
    repository: redpandadata/console
    tag: ""  # Defaults to latest if not specified
  replicas: 1
  kafkaBrokers: "redpanda.lifecycle-app.svc.cluster.local:9092"

g2krelay:
  enabled: true
  replicas: 1
  image:
    repository: vmelikyan/g2krelay
    tag: ""  # Defaults to Chart.AppVersion if not specified
  serviceType: ClusterIP
  servicePort: 5050
  envVars:
    KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    WEBHOOK_SECRET: "your-webhook-secret-here"
  ingress:
    enabled: true
    host: "webhooks.example.com"
    path: "/"
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: webhooks-tls
        hosts:
          - webhooks.example.com

# Multiple g2krepeater instances with different configurations
# This will deploy multiple repeaters
g2krepeaters:

  production:
    enabled: true
    replicas: 3
    image:
      repository: vmelikyan/g2krepeater
      tag: ""  # Defaults to Chart.AppVersion
    envVars:
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_GROUP_ID: "g2krepeater-production"
      REPLAY_ENDPOINTS: "https://prod.example.com/webhooks,https://prod-backup.example.com/webhooks"
      REPO_FILTERS: ""  # Process all repositories
  
  development:
    enabled: true
    replicas: 1
    image:
      repository: vmelikyan/g2krepeater
      tag: "0.3.4"  # Pin to specific version
    envVars:
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_GROUP_ID: "g2krepeater-development"
      REPLAY_ENDPOINTS: "https://dev.example.com/webhooks"
      REPO_FILTERS: "myorg/frontend,myorg/backend,myorg/mobile-app"

# Legacy configuration (if you prefer single repeater, leave g2krepeaters empty)
# This will create a single repeater named 'default'
g2krepeater:
  enabled: false  # Disabled when using multiple repeaters
  replicas: 1
  image:
    repository: vmelikyan/g2krepeater
    tag: ""  # Defaults to Chart.AppVersion if not specified
  envVars:
    KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    KAFKA_GROUP_ID: "g2krepeater-default"
    REPLAY_ENDPOINTS: ""

